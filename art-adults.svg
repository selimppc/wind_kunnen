      <path d="M34 -10 V10 M52 -10 V10 M70 -10 V10 M88 -10 V10 M106 -10 V10 M124 -10 V10 M142 -10 V10" fill="none" stroke="currentColor"/>
    </g>
    <g transform="translate(220 275) rotate(135)">
      <path d="M16 -10 H150 V10 H16 Z" fill="none" stroke="currentColor"/>
      <path d="M16 0 H150" fill="none" stroke="currentColor"/>
      <path d="M34 -10 V10 M52 -10 V10 M70 -10 V10 M88 -10 V10 M106 -10 V10 M124 -10 V10 M142 -10 V10" fill="none" stroke="currentColor"/>
