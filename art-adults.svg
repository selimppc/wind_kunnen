  </g>

  <!-- brickwork hint -->
  <g class="brick"><path d="M160 470 H280 M157 498 H283 M153 526 H287 M149 554 H291"/></g>

  <!-- wind being caught by the sails -->
  <g class="wind">
    <path d="M40 150 C92 126 132 158 150 134"/>
    <path d="M150 134 c12 -10 4 -26 -10 -20"/>
    <path d="M48 196 C104 180 142 204 170 180"/>
    <path d="M400 150 C348 126 308 158 290 134"/>
