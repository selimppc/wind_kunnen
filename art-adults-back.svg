<?xml version="1.0" encoding="UTF-8"?>
<!--
  De Kerkhovense Molen — ACHTERKANT (optie) — VOLWASSENEN
  Print-ready vector. Brandbook colours only: Molenbruin #412F26, Tuingroen-donker #5E7E54.
  NB voor de drukker: zet de tekst om naar outlines (Playfair Display / Arial).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="Achterkant — Wind kunnen we pakken (volwassenen)">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,700&amp;display=swap');
      .ph  { fill:#412F26; font-family:"Playfair Display",Georgia,serif; }
      .ph1 { font-size:24px; font-weight:600; }
      .ph2 { font-size:42px; font-weight:700; font-style:italic; }
      .wm  { fill:#412F26; font-family:"Helvetica Neue",Arial,sans-serif; }
      .wm1 { font-size:14px; font-weight:700; letter-spacing:1.6px; }
      .wm2 { font-size:8.4px; letter-spacing:.8px; opacity:.85; }
      .flo { fill:none; stroke:#5E7E54; stroke-width:2; stroke-linecap:round; }
      .flo circle { fill:#5E7E54; stroke:none; }
    </style>
  </defs>

  <text x="300" y="64"  text-anchor="middle" class="ph ph1">Brood en lucht kun je bakken</text>
  <text x="300" y="120" text-anchor="middle" class="ph ph2">Wind kunnen we pakken!</text>

  <g class="flo">
    <path d="M200 152 C250 136 280 164 300 152 C320 164 350 136 400 152"/>
    <path d="M200 152 c-10 -8 -22 -2 -16 8" />
    <path d="M400 152 c10 -8 22 -2 16 8" />
    <circle cx="300" cy="152" r="2.6"/>
  </g>

  <text x="300" y="232" text-anchor="middle" class="wm wm1">DE KERKHOVENSE MOLEN</text>
  <text x="300" y="250" text-anchor="middle" class="wm wm2">OISTERWIJK · NATUURLIJK GEZOND · SINDS 1369</text>
</svg>
