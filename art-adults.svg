<?xml version="1.0" encoding="UTF-8"?>
<!--
  De Kerkhovense Molen — "Wind kunnen we pakken" — VOLWASSENEN / molenfanaten
  Print-ready vector. Brandbook colours only: Molenbruin #412F26, Tuingroen-donker #5E7E54.
  NB voor de drukker: zet de tekst om naar outlines (lettertypes Playfair Display / Arial).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 660" width="440" height="660" role="img" aria-label="De Kerkhovense Molen vangt de wind — volwassenen">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,700&amp;display=swap');
      .ph  { fill:#412F26; font-family:"Playfair Display",Georgia,serif; }
      .ph1 { font-size:21px; font-weight:600; }
      .ph2 { font-size:27px; font-weight:700; font-style:italic; }
      .wm  { fill:#412F26; font-family:"Helvetica Neue",Arial,sans-serif; }
      .wm1 { font-size:14px; font-weight:700; letter-spacing:1.6px; }
      .wm2 { font-size:8.4px; letter-spacing:.8px; opacity:.85; }
      .wind { fill:none; stroke:#5E7E54; stroke-width:1.6; stroke-linecap:round; }
      .brick { fill:none; stroke:#412F26; stroke-width:1; opacity:.4; }
    </style>
  </defs>

  <!-- catchphrase -->
  <text x="220" y="56" text-anchor="middle" class="ph ph1">Brood en lucht kun je bakken</text>
  <text x="220" y="97" text-anchor="middle" class="ph ph2">Wind kunnen we pakken!</text>

  <!-- mill (stellingmolen) -->
  <g color="#412F26" fill="none" stroke="#412F26" stroke-width="1.7" stroke-linecap="butt" stroke-linejoin="round">
