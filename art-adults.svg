  <!-- wordmark -->
  <text x="220" y="624" text-anchor="middle" class="wm wm1">DE KERKHOVENSE MOLEN</text>
  <text x="220" y="642" text-anchor="middle" class="wm wm2">OISTERWIJK · NATUURLIJK GEZOND · SINDS 1369</text>
</svg>
