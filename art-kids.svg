<?xml version="1.0" encoding="UTF-8"?>
<!--
  De Kerkhovense Molen — "Wind kunnen we pakken" — KIDS
  Print-ready vector. Brandbook colours only: Molenbruin #412F26, Tuingroen #7B9B6F.
  NB voor de drukker: zet de tekst om naar outlines (lettertypes Fredoka / Arial).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 660" width="440" height="660" role="img" aria-label="Vrolijke Kerkhovense Molen vangt de wind — kinderen">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&amp;display=swap');
      .ph  { font-family:"Fredoka","Trebuchet MS",sans-serif; }
      .ph1 { fill:#412F26; font-size:20px; font-weight:600; }
      .ph2 { fill:#7B9B6F; font-size:26px; font-weight:700; }
      .wm  { fill:#412F26; font-family:"Helvetica Neue",Arial,sans-serif; }
      .wm1 { font-size:14px; font-weight:700; letter-spacing:1.6px; }
      .wm2 { font-size:8.4px; letter-spacing:.8px; opacity:.85; }
      .wind { fill:none; stroke:#7B9B6F; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .dot  { fill:#7B9B6F; stroke:none; }
      .face-line { fill:none; stroke:#412F26; stroke-linecap:round; }
      .eye  { fill:#412F26; }
      .cheek{ fill:#7B9B6F; opacity:.35; }
    </style>
  </defs>

  <!-- catchphrase -->
  <text x="220" y="56" text-anchor="middle" class="ph ph1">Brood en lucht kun je bakken</text>
  <text x="220" y="98" text-anchor="middle" class="ph ph2">Wind kunnen we pakken!</text>

  <!-- mill (stellingmolen, friendlier thick lines) -->
  <g color="#412F26" fill="none" stroke="#412F26" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 584 H400" fill="none" stroke="currentColor"/>
    <path d="M78 548 L119 520 L160 548" fill="none" stroke="currentColor"/>
    <path d="M88 548 V584 H150" fill="none" stroke="currentColor"/>
    <path d="M104 584 V564 H120 V584" fill="none" stroke="currentColor"/>
    <rect x="129" y="556" width="12" height="12" fill="none" stroke="currentColor"/>
    <path d="M164 442 H276 L294 570 H146 Z" fill="none" stroke="currentColor"/>
    <path d="M198 570 V520 Q198 506 220 506 Q242 506 242 520 V570" fill="none" stroke="currentColor"/>
    <path d="M142 570 H298 V584 H142 Z" fill="currentColor" stroke="currentColor"/>
    <path d="M156 416 H282" fill="none" stroke="currentColor"/>
    <path d="M166 416 V430 M182 416 V430 M198 416 V430 M214 416 V430 M230 416 V430 M246 416 V430 M262 416 V430 M278 416 V430" fill="none" stroke="currentColor"/>
    <path d="M156 430 H284 L276 442 H164 Z" fill="none" stroke="currentColor"/>
    <path d="M188 320 H252 L264 430 H176 Z" fill="none" stroke="currentColor"/>
    <path d="M210 380 V354 Q210 344 220 344 Q230 344 230 354 V380 Z" fill="none" stroke="currentColor"/>
    <path d="M178 320 C178 270 196 244 220 240 C244 244 262 270 262 320" fill="none" stroke="currentColor"/>
    <path d="M220 240 V224" fill="none" stroke="currentColor"/>
    <circle cx="220" cy="221" r="3" fill="currentColor"/>
    <g transform="translate(220 275) rotate(45)">
      <path d="M16 -10 H150 V10 H16 Z" fill="none" stroke="currentColor"/>
      <path d="M16 0 H150" fill="none" stroke="currentColor"/>
      <path d="M34 -10 V10 M52 -10 V10 M70 -10 V10 M88 -10 V10 M106 -10 V10 M124 -10 V10 M142 -10 V10" fill="none" stroke="currentColor"/>
    </g>
    <g transform="translate(220 275) rotate(135)">
      <path d="M16 -10 H150 V10 H16 Z" fill="none" stroke="currentColor"/>
      <path d="M16 0 H150" fill="none" stroke="currentColor"/>
      <path d="M34 -10 V10 M52 -10 V10 M70 -10 V10 M88 -10 V10 M106 -10 V10 M124 -10 V10 M142 -10 V10" fill="none" stroke="currentColor"/>
    </g>
    <g transform="translate(220 275) rotate(225)">
      <path d="M16 -10 H150 V10 H16 Z" fill="none" stroke="currentColor"/>
      <path d="M16 0 H150" fill="none" stroke="currentColor"/>
      <path d="M34 -10 V10 M52 -10 V10 M70 -10 V10 M88 -10 V10 M106 -10 V10 M124 -10 V10 M142 -10 V10" fill="none" stroke="currentColor"/>
    </g>
    <g transform="translate(220 275) rotate(315)">
      <path d="M16 -10 H150 V10 H16 Z" fill="none" stroke="currentColor"/>
      <path d="M16 0 H150" fill="none" stroke="currentColor"/>
      <path d="M34 -10 V10 M52 -10 V10 M70 -10 V10 M88 -10 V10 M106 -10 V10 M124 -10 V10 M142 -10 V10" fill="none" stroke="currentColor"/>
    </g>
    <circle cx="220" cy="275" r="9" fill="currentColor"/>
  </g>

  <!-- happy face -->
  <g>
    <circle cx="206" cy="482" r="4" class="eye"/>
    <circle cx="234" cy="482" r="4" class="eye"/>
    <path d="M202 494 Q220 510 238 494" class="face-line" stroke-width="3.4"/>
    <circle cx="190" cy="495" r="6" class="cheek"/>
    <circle cx="250" cy="495" r="6" class="cheek"/>
  </g>

  <!-- bold gusts diving into the sails -->
  <g class="wind">
    <path d="M34 160 C86 128 128 170 156 132 c20 -16 0 -42 -22 -26 c-12 9 -4 26 10 22"/>
    <path d="M406 160 C354 128 312 170 284 132 c-20 -16 0 -42 22 -26 c12 9 4 26 -10 22"/>
  </g>
  <circle cx="76" cy="118" r="5" class="dot"/>
  <circle cx="364" cy="118" r="5" class="dot"/>
  <circle cx="120" cy="92" r="3.4" class="dot"/>
  <circle cx="320" cy="92" r="3.4" class="dot"/>

  <!-- wordmark -->
  <text x="220" y="624" text-anchor="middle" class="wm wm1">DE KERKHOVENSE MOLEN</text>
  <text x="220" y="642" text-anchor="middle" class="wm wm2">OISTERWIJK · NATUURLIJK GEZOND · SINDS 1369</text>
</svg>
